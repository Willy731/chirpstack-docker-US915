# See https://www.chirpstack.io/gateway-bridge/install/config/ for a full
# configuration example and documentation.

# Gateway backend configuration
[backend]
type="concentratord"

[backend.concentratord]
enabled=true
event_url="ipc:///tmp/concentratord_event"
command_url="ipc:///tmp/concentratord_command"
#event_url="ipc:///var/run/chirpstack-concentratord/concentratord_event"
#command_url="ipc:///var/run/chirpstack-concentratord/concentratord_command"

# MQTT integration
[integration.mqtt]
event_topic_template="us915_0/gateway/{{ .GatewayID }}/event/{{ .EventType }}"
state_topic_template="us915_0/gateway/{{ .GatewayID }}/state/{{ .StateType }}"
command_topic_template="us915_0/gateway/{{ .GatewayID }}/command/#"

[integration.mqtt.auth.generic]
servers=["tcp://mosquitto:1883"]
username=""
password=""
